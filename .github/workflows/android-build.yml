# Builds the Capacitor Android APK/AAB from the web bundle. Secrets degrade
# gracefully: no keystore => debug-signed (testable, not uploadable); no Play
# service account => artifact only. Google requires the FIRST upload of a new
# app to be manual in the Console; the Play step takes over from build 2.
name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "vercel.json"

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced in step `if:` directly; presence flags here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # The interface is skinned with licensed art that may not live in this
      # public repo, so public/cb/ is git-ignored and a checkout doesn't have it.
      # Nothing breaks without it — vite copies public/ verbatim, the sprite
      # classes only set custom properties, and the game comes out with every
      # panel and button an untextured box. On a phone there isn't even a console
      # to warn into, so a build made without the kit must not reach Play.
      HAS_CHROME: ${{ secrets.CB_KIT_TOKEN != '' }}
      CB_KIT_TOKEN: ${{ secrets.CB_KIT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Capacitor CLI 8 requires Node >= 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # Capacitor 8 / AGP 8.x need JDK 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Fetch the Casual Blue chrome
        if: env.HAS_CHROME == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CB_KIT_TOKEN}@github.com/ai-asylum/casual-blue-ui.git" \
            ../casual-blue-ui
          npm run cb:sync

      # Belt and braces: cb:sync can succeed against a kit that has moved on and
      # still leave a sprite the manifest claims unaccounted for.
      - name: Check the chrome is all there
        if: env.HAS_CHROME == 'true'
        run: node scripts/check-cb.mjs

      - name: Warn that this build has no chrome
        if: env.HAS_CHROME != 'true'
        run: |
          echo "::warning::No CB_KIT_TOKEN, so this build's UI is untextured boxes." \
               "The artifact is marked unshippable and the Play upload is skipped." \
               "Add the secret before the first Play upload — see NOTICE-casual-blue.md."

      - name: Build web bundle
        env:
          # Absent secrets => the APK ships analytics/attribution OFF (no-op).
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_APPSFLYER_DEV_KEY: ${{ secrets.VITE_APPSFLYER_DEV_KEY }}
        run: npm run build

      - name: Sync web bundle into the Android project
        run: npx cap sync android

      - name: Decode Play upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks

      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && '/tmp/upload-keystore.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }} # Play needs strictly increasing
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # The human checklist says to grab this and upload it by hand, so an
          # unskinned one has to say so in the only place they'll look.
          name: ${{ env.HAS_CHROME == 'true' && 'skippidyskip-android-release' || 'skippidyskip-android-release-UNSKINNED-do-not-upload' }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload AAB to Play (internal track)
        id: play_upload
        if: github.event_name == 'push' && env.HAS_PLAY_SA == 'true' && env.HAS_CHROME == 'true'
        # Google requires the first upload of a new app to be made by hand in the
        # Console, so until that happens the package does not exist and this step
        # can only fail ("Package not found"). Set the repo variable
        # PLAY_APP_LIVE=true right after that first manual upload to make failures
        # here block again.
        continue-on-error: ${{ vars.PLAY_APP_LIVE != 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: games.misaligned.skippidyskip
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          # completed = live to internal testers on merge (internal track has no
          # Google review and no public exposure). The HUMAN gate is promoting
          # to closed/production in the Play Console — that's the submission.
          status: completed

      - name: Explain a tolerated Play upload failure
        if: steps.play_upload.outcome == 'failure'
        run: |
          echo "::notice::Play upload did not go through. Expected while the app does not exist in the Play Console yet — grab app-release.aab from this run's artifacts and upload it by hand once. Then run: gh variable set PLAY_APP_LIVE --repo ai-asylum/skimmers --body true"
